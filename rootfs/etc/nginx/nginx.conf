worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Avoid recording Ingress URLs, cookies or authentication data.
    access_log off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_x_ingress_path $kuma_ingress_path {
        default "";
        "~^(/api/hassio_ingress/[A-Za-z0-9_-]+)/?$" $1;
    }
    server {
        listen 8099;
        server_name _;
        # Ingress owns the public scheme, hostname and port.
        absolute_redirect off;
        allow 172.30.32.2;
        deny all;
        if ($kuma_ingress_path = "") { return 400; }
        client_max_body_size 10m;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_redirect ~^(/.*)$ $kuma_ingress_path$1;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            sub_filter_once off;
            sub_filter '__KUMA_INGRESS_PATH__' '$kuma_ingress_path';
        }
    }
}
