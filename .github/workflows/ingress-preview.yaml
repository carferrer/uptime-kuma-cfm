name: Ingress preview
on:
  pull_request:
    paths:
      - "ingress-preview/**"
      - ".github/workflows/ingress-preview.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test adaptation helpers
        run: node --test ingress-preview/tests/adaptation.test.mjs
      - name: Build preview (never publish)
        run: docker build -t kuma-ingress-preview ingress-preview
      - name: Start isolated preview
        run: |
          docker network create --subnet 172.30.32.0/24 ingress-test
          docker run -d --name supervisor --network ingress-test --ip 172.30.32.2 -p 127.0.0.1:18099:8080 \
            -v "$PWD/ingress-preview/tests:/tests:ro" \
            --entrypoint node kuma-ingress-preview /tests/supervisor-stub.cjs
          docker run -d --name kuma-preview --network ingress-test --ip 172.30.32.3 \
            -e SUPERVISOR_TOKEN=ci-fixture-only kuma-ingress-preview
      - name: Test Supervisor access and WebSocket
        timeout-minutes: 3
        run: |
          docker exec supervisor node /tests/smoke.cjs
      - name: Test rejection of other clients
        run: |
          docker run --rm --network ingress-test --ip 172.30.32.4 \
            -v "$PWD/ingress-preview/tests:/tests:ro" \
            --entrypoint node kuma-ingress-preview /tests/smoke.cjs denied
      - name: Browser routing regression
        timeout-minutes: 5
        run: |
          npm install --prefix /tmp/kuma-browser playwright@1.56.1
          /tmp/kuma-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/kuma-browser/node_modules node ingress-preview/tests/browser.cjs
      - name: Container logs
        if: always()
        run: docker logs kuma-preview || true
      - name: Clean up
        if: always()
        run: |
          docker rm -f kuma-preview supervisor || true
          docker network rm ingress-test || true
