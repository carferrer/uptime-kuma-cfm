name: Renovate Bot
on:
  # Te permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch: 

  schedule:
    # Se ejecuta todas las noches a las 2:00 AM UTC
    - cron: '0 2 * * *'
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Ejecutar Renovate
        uses: renovatebot/github-action@v46.2.2  # Usa siempre la última versión disponible
        with:
          configurationFile: .github/renovate.json
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
